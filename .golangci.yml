version: "2"

linters:
  default: all
  disable:
    # Whitespace and naming preferences that fight the codebase's compact style.
    - lll
    - nlreturn
    - varnamelen
    - wsl
    - wsl_v5
    # JSON tags follow provider and API wire formats, not one casing.
    - tagliatelle
    # Zero values are intentional.
    - exhaustruct
    - exhaustruct_v5
    # Bans `if err := f(); err != nil`.
    - noinlineerr
    # Error strings are user-facing messages built where they occur.
    - err113
    # Stdlib errors carry context, and some flow verbatim into client responses.
    - wrapcheck
    # Status codes, sizes, and durations read better inline.
    - mnd
    # Wire-format field names repeat by nature.
    - goconst
    # The module has no third-party dependencies to restrict.
    - depguard
    # Reports helpers that sweep shared state with their own context.
    - contextcheck
    # Deprecated in favour of gomodguard_v2, which default: all also enables.
    - gomodguard
  settings:
    cyclop:
      max-complexity: 15
    funlen:
      lines: 100
      statements: 60
    gocognit:
      min-complexity: 30
    gocyclo:
      min-complexity: 20
    nestif:
      min-complexity: 5
    errchkjson:
      # Allow ignoring errors from types that cannot fail to encode.
      check-error-free-encoding: true
    exhaustive:
      default-signifies-exhaustive: false
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        # Accounts, models, and requests are passed and ranged by value on purpose:
        # callers get snapshots, and pointers would alias shared state.
        - hugeParam
        - rangeValCopy
        # Conflicts with nonamedreturns.
        - unnamedResult
        # Conflicts with exhaustive when the default branch also serves a listed case.
        - emptyFallthrough
    staticcheck:
      checks:
        - all
        # golangci-lint's defaults.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # Error strings are user-facing messages shown in the UI.
        - -ST1005
        # Suggests a switch for two-way comparisons.
        - -QF1003
  exclusions:
    presets:
      # Unchecked Close, os.Remove*, and fmt.Fprint* errors.
      - std-error-handling
    rules:
      # Same reason as ST1005.
      - linters: [revive]
        text: "^error-strings:"
      # The CLI prints to stdout.
      - path: ^cmd/
        linters: [forbidigo]
    paths:
      - web/node_modules

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      # Without it gofumpt treats the dotless module path as stdlib.
      module-path: vrouter
    goimports:
      # The module path has no dot, so goimports would sort it in with the stdlib.
      local-prefixes:
        - vrouter
